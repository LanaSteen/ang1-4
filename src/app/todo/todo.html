

<h1>To Do App</h1>


<input type="text" [(ngModel)]="newTask">
<input type="range" [(ngModel)]="priority" min="1" max="5">
<button (click)="addTask()">Add Task</button>

<ul>
   @for (item of tasks; track $index) {
     <li>
      <span [className]="item.completed ? 'completed' : ''">{{item.title}}</span>
      <button (click)="compliteTask(item)">{{ item.completed ?  "Undo" :  "Complete"}}</button>
      <!-- <button (click)="deleteTask($index)">x</button> -->
      <button (click)="deleteTask(item.id)">x</button>
    </li>
   }
</ul>
