

<h1>To Do App</h1>


<input type="text" [(ngModel)]="newTask">
<input type="range" [(ngModel)]="priority" min="0" max="5">

<button (click)="sort()">{{textForSortBtn}}</button>
<button (click)="addTask()">{{addText}}</button>

<ul>
   @for (item of tasks; track $index) {
     <li>
      <span [className]="item.completed ? 'completed' : ''">{{item.title}}</span>
      <span>{{'⭐'.repeat(item.priority)}}</span>
      <button (click)="compliteTask(item)">{{ item.completed ?  "Undo" :  "Complete"}}</button>
      <!-- <button (click)="deleteTask($index)">x</button> -->
      <button (click)="edit(item.title, item.priority, $index)">✎</button>
      <button (click)="deleteTask($index)">x</button>
    </li>
   }
</ul>
